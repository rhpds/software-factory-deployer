# Simplified Helm chart: Creates namespace + secrets for software factory role
#
# The software factory role (ocp4_workload_software_factory) is called directly from
# AgnosticV workloads, not via a Job. This chart only creates the prerequisites.

# Namespace for secrets
namespace:
  name: software-factory-deployer
  create: true

# Sync wave for namespace
syncWave:
  rbac: "1"

# ------------------------------------------------------------------
# Injected by RHDP ocp4_workload_gitops_bootstrap
# ------------------------------------------------------------------
# keycloak: {adminUser, adminPassword, consoleUrl} -> Secret field-content-keycloak
# litemaas: {enabled, apiUrl, apiKey, model}  -> Secret field-content-litemaas
