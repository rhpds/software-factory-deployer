{{- if false }}
---
# DISABLED: Secrets are now created by the software_factory role in bootstrap_namespace.yml
# This template is kept for backwards compatibility but does nothing.
apiVersion: v1
kind: Secret
metadata:
  name: field-content-keycloak
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "ansible-runner.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWave.rbac | quote }}
type: Opaque
stringData:
  adminUser: {{ .Values.keycloak.adminUser | quote }}
  adminPassword: {{ .Values.keycloak.adminPassword | quote }}
  consoleUrl: {{ .Values.keycloak.consoleUrl | quote }}
{{- end }}
