---
# Install order matters: operators → kata → gitea → keycloak_users → RHDH → agent platform →
# RHOAI/MaaS → mattermost → registry (quay) → seats → MCP gateway → model_desk → verify → userinfo.
# Each stage gates on health before the next.
# software_factory_stages selects the stages (a list, or a comma-separated string).
# Note: GitOps is installed by ocp4_workload_openshift_gitops (separate workload).
# Note: Showroom is deployed by ocp4_workload_showroom after this role completes.
- name: workload | resolve the stage list
  ansible.builtin.set_fact:
    _stages: "{{ software_factory_stages if software_factory_stages is not string else (software_factory_stages | split(',') | map('trim') | list) }}"

- name: workload | stages selected
  ansible.builtin.debug:
    msg: "stages: {{ _stages | join(', ') }} (users: {{ num_users }})"

- ansible.builtin.include_tasks: operators.yml
  when: "'operators' in _stages"
- ansible.builtin.include_tasks: kata.yml
  when: "'kata' in _stages and kata_enabled | bool"
- ansible.builtin.include_tasks: gitea.yml
  when: "'gitea' in _stages"
- ansible.builtin.include_tasks: keycloak_users.yml
  when: "'keycloak_users' in _stages"
- ansible.builtin.include_tasks: rhdh.yml
  when: "'rhdh' in _stages"
- ansible.builtin.include_tasks: agent_platform.yml
  when: "'agent_platform' in _stages"
- ansible.builtin.include_tasks: rhoai_maas.yml
  when: "'rhoai_maas' in _stages"
- ansible.builtin.include_tasks: mattermost.yml
  when: "'mattermost' in _stages"
- ansible.builtin.include_tasks: quay.yml
  when: "'quay' in _stages"
- ansible.builtin.include_tasks: seats.yml
  when: "'seats' in _stages"
- ansible.builtin.include_tasks: mcp_gateway.yml
  when: "'mcp_gateway' in _stages"
- ansible.builtin.include_tasks: model_desk.yml
  when: "'model_desk' in _stages"
- ansible.builtin.include_tasks: verify.yml
  when: "'verify' in _stages"
- ansible.builtin.include_tasks: userinfo.yml
  when: "'userinfo' in _stages"
